[project]
name = "sub-gen"
version = "0.1.0"
description = "OpenAI-compatible video subtitle CLI"
readme = "mvp.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.10.0",
    "pysubs2>=1.8.0",
    "rich>=13.9.0",
    "translators>=6.0.0",
    "typer>=0.15.0",
]

[project.scripts]
sub-gen = "sub_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sub_gen"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".uv-cache", ".sub-gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
