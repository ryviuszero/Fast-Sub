[project]
name = "fast-sub"
version = "0.1.0"
description = "Local-first CLI for generating video subtitles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.28.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.10.0",
    "pysubs2>=1.8.0",
    "rich>=13.9.0",
    "sacrebleu>=2.5.0",
    "typer>=0.15.0",
]

[project.scripts]
fast-sub = "fast_sub.app:main"
fast-sub-worker-faster-whisper = "fast_sub_workers.faster_whisper:main"

[project.optional-dependencies]
local-asr = [
    "faster-whisper>=1.0.0",
]
local-translate = [
    "ctranslate2>=4.4.0",
    "sentencepiece>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_sub", "src/fast_sub_workers"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".uv-cache", ".fast-sub"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
